name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Verify code Fromatting
    runs-on: "ubuntu-latest"
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Format
      run: cargo fmt --all -- --check

  lint:
    name: Lint with clippy
    needs: format
    strategy:
      fail-fast: true
    runs-on: "ubuntu-latest"
    env:
      RUSTFLAGS: -Dwarnings

    steps:
    - uses: actions/checkout@v7
    # Pinned, so that the new lints of each Rust release don't fail unrelated
    # PRs. Move it to a newer release in its own PR and fix what clippy reports.
    - uses: dtolnay/rust-toolchain@1.100.0
      with:
        components: clippy
    - name: Lint
      run: cargo clippy --workspace --all-targets --verbose --all-features

  test_amd64_and_m1:
    name: Test and Build WASM
    needs: format
    # needs: [format, lint]
    strategy:
      fail-fast: true
      matrix:
        os: [ "ubuntu-latest", "macos-26-intel", "macos-26" ] # macOS on Intel and on Apple Silicon

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1 # called wasm32-wasi before Rust 1.84

    # Build for WATER host
    - name: Build WATER Host crate
      run: cargo build
      working-directory: crates/water

    # Build for wasm32-wasip1 target
    - name: Build wasm32-wasip1 Target
      run: bash ./scripts/build_wasm_targets.sh
      env:
        RUSTFLAGS: --cfg tokio_unstable

    - name: Test
      run: cargo test --verbose --workspace --all-features